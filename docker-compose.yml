services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: texttosql_pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: firmdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs ONCE on first container init (empty data dir): creates roles + extension.
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d firmdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
